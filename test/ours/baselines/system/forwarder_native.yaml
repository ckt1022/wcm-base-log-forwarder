# 系統層 baseline：全原生管線（host 內建 Rust，無 WASM 邊界）。與 forwarder_wcm.yaml 唯一差異＝plugins。
plugins:
  parse: "native"
  parse_noop: ~
  filter: "native"
  format: "native"
  transport: "native"
stages: { filter: true, format: true, transport: true }
input: { mode: tcp, tcp: { host: "0.0.0.0", port: 5140 } }
batch:
  processing_mode: batch   # 明確指定整批模式（2026-10-15 程式預設將改為 streaming）
  mem_limit_mb: 128
  buffer_size_mb: 1
  max_wait_ms: 1000
  channel_capacity: 50000
  max_format_chunk: 10000
  max_transport_bytes: 1048576
  transport_workers: 1
  pipeline_channel_capacity: 2
  stage_timeout_ms: 30000
  plugin_instance_reuse: true
endpoint: { A: "http://127.0.0.1:8080/ingest" }
config_reload_secs: 3600
