# WCM Log Forwarder Configuration
# 這個檔案是延遲測量的設定檔案

plugins:
  parse: "latency_rust_parse.wasm"
  parse_noop: ~
  filter: "latency_rust_filter.wasm"
  format: "latency_rust_format.wasm"
  transport: "transport.wasm"

# Which pipeline stages to enable
stages:
  filter: true
  format: true
  transport: true

# Input source — choose one mode
input:
  mode: tcp       # "tcp" | "tail"
  tcp:
    host: "0.0.0.0"
    port: 5140
  #tail:
  #  path: "/tmp/test-logs.log"

# Batch processing parameters (hot-reloadable at runtime)
batch:
  processing_mode: batch   # 明確指定整批模式（2026-10-15 程式預設將改為 streaming）
  mem_limit_mb: 256
  # ═══ buffer 大小觸發實驗（DUT 變因）═══════════════════════════════════
  # 設計：flush time 固定 1s 當保底（不應觸發），buffer 在 0.8s 內先填滿，
  #       每波 flush 都走 size 觸發（用 [flush] log 的 reason=size 驗收）。
  # 實測 6,608 行/MiB（輸入行均 158.7B，不含換行）→ 各欄速率（填滿 0.8s）：
  #   buffer_size_mb :    1     2     4      8
  #   gen -rate      : 8260 16520 33040  66080
  #   每波觸發行數    : 6608 13216 26432  52864
  # 註：512KB 欄需要 config 支援 KB 級（buffer_size_mb 為整數 MB），暫不可設
  buffer_size_mb: 128
  # 保底時間窗：1000ms；正常情況 buffer 先滿，reason=time 出現代表該輪作廢
  max_wait_ms: 20000
  channel_capacity: 150000
  max_format_chunk: 50000
  #transport_endpoint: "http://127.0.0.1:8080/ingest"
  # 一波一 POST（對齊 fluentd 一 chunk 一 POST / vector 一 batch 一 POST）；
  # 128KB 切分行為已在 flush-time 實驗記錄為 DUT 差異，本實驗排除此變因
  max_transport_bytes: 134217728
  transport_workers: 1
  # parse→filter / filter→format / format→transport 三條 pipeline channel 容量
  pipeline_channel_capacity: 20000
  # 每個階段 WASM 呼叫超時上限（ms）；超過後重試最多 2 次，均失敗寫入 error.txt
  stage_timeout_ms: 5000

# 單一後端
endpoint:
  A: "http://127.0.0.1:8080/ingest"

# 不要讓reload干擾延遲
config_reload_secs: 3600
