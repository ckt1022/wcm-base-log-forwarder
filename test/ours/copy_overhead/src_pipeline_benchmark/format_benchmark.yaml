plugins:
  parse: "/home/ckt1022/wcm-base-log-forwarder/test/ours/copy_overhead/parse_benchmark/c_component/parser_c_benchmark.wasm"
  parse_noop: ~
  filter: "/home/ckt1022/wcm-base-log-forwarder/test/ours/copy_overhead/filter_benchmark/component/target/wasm32-wasip2/release/filter_copy_benchmark_component.wasm"
  format: "__FORMAT_COMPONENT__"
  transport: "/home/ckt1022/wcm-base-log-forwarder/test-plugins/c-plugin/transport/latency_c_transport.wasm"

stages:
  filter: false
  format: true
  transport: false

input:
  mode: tail
  tcp: ~
  tail:
    path: "/tmp/src-pipeline-benchmark-unused.log"

batch:
