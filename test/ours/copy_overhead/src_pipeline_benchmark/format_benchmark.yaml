  max_transport_bytes: 131072
  transport_workers: 1
  pipeline_channel_capacity: 128
  stage_timeout_ms: 30000
  plugin_instance_reuse: false

endpoint:
  A: "http://127.0.0.1:8080/unused"

config_reload_secs: 3600
