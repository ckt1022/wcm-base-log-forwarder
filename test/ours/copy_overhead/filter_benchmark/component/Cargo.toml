[package]
name = "filter-copy-benchmark-component"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
