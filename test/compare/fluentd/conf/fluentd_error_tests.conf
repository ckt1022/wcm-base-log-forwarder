# Fluentd — 外部檔案存取測試（io / filetest）
#
# 測試流程:
#   1. 注入含 'filetest' 的觸發行
#   2. filter_file_access_test 嘗試讀取敏感路徑
#   3. 結果記錄在 stdout（readable / permission_denied / not_found）
#
# 目標路徑: /etc/passwd, /etc/shadow, /proc/1/environ, /run/secrets

<source>
  @type tail
  path /fluentd/log/input.log
  pos_file /tmp/input.log.pos
  tag app.log
  read_from_head true
  refresh_interval 1
  <parse>
    @type json
  </parse>
</source>

<filter app.log>
  @type file_access_test
  keyword filetest
  target_paths /etc/passwd,/etc/shadow,/proc/1/environ,/run/secrets
</filter>

<match app.log>
  @type stdout
</match>
