# Fluentd — 流量中斷測試（loop / cpu / mem）
#
# 測試流程:
#   1. loggen 持續輸入 → out_http 轉發到 sink_server
#   2. 注入 trigger 關鍵字 → filter 進入無限迴圈或記憶體耗盡
#   3. sink_server 記錄流量歸零的時間點
#
# 觸發關鍵字:
#   loop  → filter_loop_trigger  → CPU 100%、處理停止
#   cputest → filter_cpu_test   → CPU 100%、處理停止
#   memtest → filter_mem_test   → 記憶體無限增長

<source>
  @type tail
  path /fluentd/log/input.log
  pos_file /tmp/input.log.pos
  tag app.log
  read_from_head true
  refresh_interval 1
  <parse>
    @type json
  </parse>
</source>

<filter app.log>
  @type loop_trigger
  keyword loop
</filter>

<filter app.log>
  @type cpu_test
  keyword cputest
</filter>

<filter app.log>
  @type mem_test
  keyword memtest
  chunk_size_mb 50
</filter>

<match app.log>
  @type http
  endpoint http://127.0.0.1:8080/ingest
  <format>
    @type json
  </format>
  <buffer>
    @type memory
    flush_interval 1s
    chunk_limit_size 1m
  </buffer>
</match>
