# Fluentd capacity profile aligned with the final WCM profile:
# 1 CPU / 512 MiB / no swap are imposed by capacity.sh.
# Batch policy: 1 MiB or 1 second, one flush worker, no retry.

<source>
  @type tcp
  bind 0.0.0.0
  port 5140
  tag latency

  <parse>
    @type json
  </parse>
</source>

<filter latency>
  @type latency_test
</filter>

<match latency>
  @type http
  endpoint http://127.0.0.1:8080/ingest
  open_timeout 30
  read_timeout 30

  <format>
    @type json
  </format>
  json_array false

  <buffer>
    @type memory
    flush_mode interval
    flush_interval 1
    chunk_limit_size 1m
    total_limit_size 256m
    flush_thread_count 1
    flush_thread_interval 0.1
    flush_thread_burst_interval 0.01
    flush_at_shutdown true
    retry_max_times 0
    overflow_action block
  </buffer>
</match>
