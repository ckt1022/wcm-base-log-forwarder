# Fluentd v1.16 — 延遲對比實驗（對應 test/ours/latency-benchmark-C）
#
# 固定變因見 test/ours/latency-benchmark-C/setting.md；
# 本設定對齊 WCM forwarder 的 forwarder.yaml：
#   - TCP input :5140（line-delimited JSON）
#   - Ruby filter 實作 parse/filter/format 同等邏輯（plugins/filter_latency_test.rb）
#   - HTTP POST http://127.0.0.1:8080/ingest（NDJSON）
#   - flush_interval 由 FLUSH_INTERVAL 環境變數注入（latency.sh 第一個參數），
#     預設 0.1 對齊 forwarder 的 max_wait_ms=100 批次窗
#   - chunk_limit_size 128m 對齊 buffer_size_mb=128（大小觸發）
#   - 不設 chunk_limit_records：forwarder 已移除行數觸發，flush 僅由大小/時間決定
#   - flush_thread_count 1：單一 flush thread
#   - DUT 差異：out_http 一個 chunk = 一個 POST（上限 128MB），
#     forwarder 則另以 max_transport_bytes=128KB 切分 POST
#
# 由 latency.sh 以 docker（--network host）啟動

<source>
  @type tcp
  bind 0.0.0.0
  port 5140
  tag latency

  <parse>
    @type json
  </parse>
</source>

<filter latency>
  @type latency_test
</filter>

<match latency>
  @type http
  endpoint http://127.0.0.1:8080/ingest

  # NDJSON：每 record 一行 JSON（json_array false → Content-Type application/x-ndjson）
  <format>
    @type json
  </format>
  json_array false

  <buffer>
    flush_mode interval
    # DUT 變因：批次窗，由 latency.sh 以 FLUSH_INTERVAL 環境變數注入（預設 0.1）
    flush_interval "#{ENV['FLUSH_INTERVAL'] || '0.1'}"
    # 對齊 forwarder buffer_size_mb=128；注意 fluentd 實際 size trigger
    # 在 chunk_limit_size * chunk_full_threshold（預設 0.95）≈ 121.6MB
    chunk_limit_size 128m
    # memory buffer total_limit_size 用預設 512MB，可容納 4 個滿 chunk
    flush_thread_count 1
    # flush_thread_interval 固定 0.1，「不要」跟著 flush_interval 放大：
    # enqueue thread 的輪詢週期 = max(flush_interval/11, flush_thread_interval)，
    # 且輪詢時間格以 fluentd「啟動時刻」對齊，不是以第一筆 record 對齊。
    # 若設成 = flush_interval，第一個 chunk 到期後還要枯等下一個輪詢點，
    # 首批延遲最壞 ≈ 2×flush_interval（實測 5s 窗首批 8.5s、10s 窗首批 13.5s）；
    # 穩態不受影響（後續 chunk 都在前一次 flush 後立刻建立，相位自動對齊）。
    # 固定 0.1 後輪詢粒度 = max(flush_interval/11, 0.1)，首批誤差被壓到一個
    # 輪詢粒度內（另有 ±1s 固有誤差：flush 條件以整數秒比較，見下）。
    #
    # sub-second 註記：flush_interval < 1 時 output.rb enqueue_thread_run 以
    # flush_interval.to_i 截斷成 0，條件 raw_create_at + 0 <= now_int 恆為真，
    # 真正的批次窗 = 輪詢週期 = flush_thread_interval（=0.1 恰好對齊 100ms 批次窗；
    # 設 0.05 時實測每 50ms flush 一次，p50 只有 ~28ms）
    flush_thread_interval 0.1
    flush_thread_burst_interval 0.01
    flush_at_shutdown true
    retry_max_times 3
    overflow_action block
  </buffer>
</match>
