version: "3.8"
services:
  fluentd:
    build: .
    container_name: fluentd
    ports:
      - "24224:24224"      # forward 協定 (例如 docker logging driver 會用這個)
      - "24224:24224/udp"
      - "9880:9880"         # http input
    volumes:
      - ./fluent.conf:/fluentd/etc/fluent.conf
      - ./plugins:/fluentd/plugins
    environment:
      - FLUENTD_CONF=fluent.conf