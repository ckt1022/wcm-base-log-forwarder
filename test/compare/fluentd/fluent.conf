<system>
  path /fluentd/etc/plugins
</system>

<source>
  @type tail
  path /fluentd/log/input.log
  pos_file /fluentd/log/input.log.pos
  tag app.log
  <parse>
    @type none
  </parse>
</source>

<filter app.log>
  @type file_access_test
  keyword filetest
</filter>

<filter app.log>
  @type cpu_test
  keyword cputest
  worker_threads 2
</filter>

<filter app.log>
  @type mem_test
  keyword memtest
  chunk_size_mb 50
</filter>

<filter app.log>
  @type loop_trigger
  keyword loop
</filter>

<match app.log>
  @type stdout
</match>

<buffer>
  @type memory
  chunk_limit_size 256MB
  total_limit_size 0   # 0 在某些版本代表不限制
  flush_interval 9999s # 故意拖很久不 flush
</buffer>