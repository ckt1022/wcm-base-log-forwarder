# Vector — 全量測試設定（docker-compose 互動用）
# 所有 Lua transform 依序串聯，輸出至 stdout
# 等同 Fluentd 的 fluent.conf

[sources.file_input]
type = "file"
include = ["/etc/vector/test-logs.log"]
read_from = "beginning"

[transforms.parse_json]
type = "remap"
inputs = ["file_input"]
source = '''
  result, err = parse_json(.message)
  if err == null {
    . = result
  }
'''

[transforms.file_access]
type = "lua"
version = "2"
inputs = ["parse_json"]
source = 'dofile("/etc/vector/lua/file_access.lua")'
hooks.process = "process"

[transforms.cpu_stress]
type = "lua"
version = "2"
inputs = ["file_access"]
source = 'dofile("/etc/vector/lua/cpu_stress.lua")'
hooks.process = "process"

[transforms.mem_stress]
type = "lua"
version = "2"
inputs = ["cpu_stress"]
source = 'dofile("/etc/vector/lua/mem_stress.lua")'
hooks.process = "process"

[transforms.loop_trigger]
type = "lua"
version = "2"
inputs = ["mem_stress"]
source = 'dofile("/etc/vector/lua/loop_trigger.lua")'
hooks.process = "process"

[sinks.stdout_output]
type = "console"
inputs = ["loop_trigger"]
encoding.codec = "json"
