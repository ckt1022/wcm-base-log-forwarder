# Vector — 外部檔案存取測試（io / filetest）
#
# 測試流程:
#   1. 注入含 "filetest" 的觸發行
#   2. file_access.lua 嘗試讀取敏感路徑
#   3. 結果記錄在 stdout（readable / permission_denied / error）
#
# 目標路徑: /etc/passwd, /etc/shadow, /proc/1/environ, /run/secrets

[sources.file_input]
type = "file"
include = ["/etc/vector/test-logs.log"]
read_from = "beginning"

[transforms.parse_json]
type = "remap"
inputs = ["file_input"]
source = '''
  result, err = parse_json(.message)
  if err == null {
    . = result
  }
'''

[transforms.file_access]
type = "lua"
version = "2"
inputs = ["parse_json"]
source = 'dofile("/etc/vector/lua/file_access.lua")'
hooks.process = "process"

[sinks.stdout_output]
type = "console"
inputs = ["file_access"]
framing.method = "newline_delimited"
encoding.codec = "json"
