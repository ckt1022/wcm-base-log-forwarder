# batch_alignment copy of fluentbit/latency/conf/capacity_wasm_1s.conf; only Flush changed (=0.0512) and WASM_Path made absolute
# Fluent Bit Rust WASM — 正式最大容量實驗
# 外部條件：1 CPU / 512 MiB / no swap，由 capacity.sh 的 docker 參數限制。
# Fluent Bit engine chunk 是約 2 MiB soft limit，沒有可精確設為 1 MiB 的
# output batch 參數；因此固定原生 chunk 策略，只對齊 1 秒 flush 與單 worker。

[SERVICE]
    Flush         0.0512
    Grace         5
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5140
    Format        json
    Tag           latency

[FILTER]
    Name             wasm
    Match            latency
    WASM_Path        /home/ckt1022/wcm-base-log-forwarder/test/compare/fluentbit/latency/wasm_file/latency_filter.wasm
    Function_Name    filter_func
    Wasm_Heap_Size   268435456
    Wasm_Stack_Size  8388608

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           8080
    URI            /ingest
    Format         json_lines
    Json_date_key  false
    Workers        1
    Retry_Limit    False
