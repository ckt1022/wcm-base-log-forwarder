# batch_alignment copy of fluentd/latency/conf/capacity_1m_1s.conf — only <buffer> batching knobs changed.
# Method 3 W=0.01 s: fluentd truncates flush_interval<1 to 0 and the real window = enqueue period = max(flush_interval/11, flush_thread_interval) = flush_thread_interval = 0.01; chunk 128m so size never triggers

<source>
  @type tcp
  bind 0.0.0.0
  port 5140
  tag latency

  <parse>
    @type json
  </parse>
</source>

<filter latency>
  @type latency_test
</filter>

<match latency>
  @type http
  endpoint http://127.0.0.1:8080/ingest
  open_timeout 30
  read_timeout 30

  <format>
    @type json
  </format>
  json_array false

  <buffer>
    @type memory
    flush_mode interval
    flush_interval 0.01
    chunk_limit_size 128m
    total_limit_size 256m
    flush_thread_count 1
    flush_thread_interval 0.01
    flush_thread_burst_interval 0.01
    flush_at_shutdown true
    retry_max_times 0
    overflow_action block
  </buffer>
</match>
