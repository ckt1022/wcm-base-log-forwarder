# batch_alignment copy of fluentbit/latency/conf/capacity_lua_1s.conf; only Flush changed (=0.5) and Script path made absolute
# Fluent Bit Lua — 正式最大容量實驗
# 外部條件：1 CPU / 512 MiB / no swap，由 capacity.sh 的 docker 參數限制。
# Fluent Bit engine chunk 是約 2 MiB soft limit，沒有可精確設為 1 MiB 的
# output batch 參數；因此固定原生 chunk 策略，只對齊 1 秒 flush 與單 worker。

[SERVICE]
    Flush         0.5
    Grace         5
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5140
    Format        json
    Tag           latency

[FILTER]
    Name            lua
    Match           latency
    Script          /home/ckt1022/wcm-base-log-forwarder/test/compare/fluentbit/latency/latency_filter.lua
    Call            latency_filter
    protected_mode  false

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           8080
    URI            /ingest
    Format         json_lines
    Json_date_key  false
    Workers        1
    Retry_Limit    False
