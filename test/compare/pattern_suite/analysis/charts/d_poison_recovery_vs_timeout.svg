<text x="172" y="118" class="legend">measured recovery (median of 3; all 3 reps identical at 1 s resolution)</text>
<line x1="132" y1="141" x2="163" y2="141" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
<text x="172" y="147" class="legend">4 × stage_timeout (3 whole-batch attempts + bisection probes)</text>
<text x="1347" y="671" text-anchor="end" class="note">watchdog OFF (epoch_interruption=false): stall never ends — 59 s at 0 records/s until the harness stopped the run</text>
<text x="1347" y="693" text-anchor="end" class="note">streaming k=256, 5,000 EPS, poison injected at t=15 s; native run, sink 1 s bins; 12 isolation calls, only the poison line lost</text>
