# pattern_suite: copy of batch_alignment/conf/wcm_tw128_wait100.yaml; only max_transport_bytes 1048576 -> 134217728 (time-triggered only)
# batch_alignment: copy of forwarder_membound_tw128.yaml (128 MB buffer => time-dominated); only max_wait_ms changed (=100)
plugins:
  parse: "latency_rust_parse.wasm"
  parse_noop: ~
  filter: "latency_rust_filter.wasm"
  format: "latency_rust_format.wasm"
  transport: "transport.wasm"
stages:
  filter: true
  format: true
  transport: true
input:
  mode: tcp
  tcp:
    host: "0.0.0.0"
    port: 5140
batch:
  processing_mode: batch   # 明確指定整批模式（2026-10-15 程式預設將改為 streaming）
  mem_limit_mb: 256
  buffer_size_mb: 128
  max_wait_ms: 100
  channel_capacity: 50000
  max_format_chunk: 10000
  max_transport_bytes: 134217728
  transport_workers: 1
  pipeline_channel_capacity: 2
  stage_timeout_ms: 30000
  plugin_instance_reuse: true
endpoint:
  A: "http://127.0.0.1:8080/ingest"
config_reload_secs: 3600
