[package]
name    = "latency_filter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"

# Release profile: minimise WASM binary size（同 wasm_filter/wasm_file 的設定）
[profile.release]
opt-level = "s"
lto        = true
panic      = "abort"
strip      = true
