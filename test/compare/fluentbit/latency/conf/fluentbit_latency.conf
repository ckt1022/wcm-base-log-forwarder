# Fluent Bit v5 — 延遲對比實驗（對應 test/ours/latency-benchmark-Rust）
#
# 固定變因見 test/ours/latency-benchmark-Rust/setting.md；
# 本設定對齊 WCM forwarder 的 forwarder.yaml：
#   - TCP input :5140（line-delimited JSON）
#   - Lua filter 實作 parse/filter/format 同等邏輯（latency_filter.lua）
#   - HTTP POST http://127.0.0.1:8080/ingest（NDJSON）
#   - Flush 0.1 對齊 forwarder 的 max_wait_ms=100 批次窗
#   - DUT 差異：fluent-bit 的 chunk 由引擎內部管理（soft limit 約 2MB），
#     無法對齊 forwarder 的 buffer_size_mb=128；也沒有行數/大小 flush 觸發，
#     flush 僅由 [SERVICE] Flush 時間窗決定
#
# 由 script/latency_lua.sh 啟動（工作目錄 = conf/，Script 相對路徑兩種解析法皆正確）

[SERVICE]
    Flush         1
    Grace         5
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5140
    Format        json
    Tag           latency

[FILTER]
    Name            lua
    Match           latency
    Script          ../latency_filter.lua
    Call            latency_filter
    # DUT 參數：關閉 pcall 保護以取最佳延遲（forwarder 端的沙箱屬於受測差異）
    protected_mode  false

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           8080
    URI            /ingest
    Format         json_lines
    # 不注入 fluent-bit 自己的時間欄位；record 內已有原始 timestamp
    Json_date_key  false
    # 對齊 forwarder 的 transport_workers=2
    Workers        1
    # DUT 參數（記錄用）：net.keepalive 預設 on，與 forwarder 每請求新開連線不同
