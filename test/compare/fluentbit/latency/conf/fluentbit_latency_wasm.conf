# Fluent Bit v5 — 延遲對比實驗（Rust WASM filter 版）
#
# 固定變因見 test/ours/latency-benchmark-Rust/setting.md；
# 與 fluentbit_latency.conf（Lua 版）唯一差異：FILTER 改用 wasm plugin，
# 邏輯完全相同（wasm_file/src/lib.rs ↔ latency_filter.lua）：
#   - TCP input :5140（line-delimited JSON）
#   - filter：只保留 level >= warn；ts → timestamp 原封不動；att.* 攤平
#   - HTTP POST http://127.0.0.1:8080/ingest（NDJSON）
#   - Flush 0.1 對齊 forwarder 的 max_wait_ms=100 批次窗
#   - DUT 差異：fluent-bit 的 chunk 由引擎內部管理（soft limit 約 2MB），
#     無法對齊 forwarder 的 buffer_size_mb=128；也沒有行數/大小 flush 觸發，
#     flush 僅由 [SERVICE] Flush 時間窗決定
#
# 由 script/latency_wasm.sh 啟動（工作目錄 = conf/，相對路徑兩種解析法皆正確）

[SERVICE]
    Flush         1
    Grace         5
    Daemon        off
    Log_Level     info
    HTTP_Server   off

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5140
    Format        json
    Tag           latency

[FILTER]
    Name             wasm
    Match            latency
    WASM_Path        ../wasm_file/latency_filter.wasm
    Function_Name    filter_func
    # DUT 參數：heap 對齊 forwarder 的 mem_limit_mb=256；stack 同 wasm_filter 慣例
    Wasm_Heap_Size   268435456
    Wasm_Stack_Size  8388608

[OUTPUT]
    Name           http
    Match          latency
    Host           127.0.0.1
    Port           8080
    URI            /ingest
    Format         json_lines
    # 不注入 fluent-bit 自己的時間欄位；record 內已有原始 timestamp
    Json_date_key  false
    # 對齊 forwarder 的 transport_workers=2
    Workers        1
    # DUT 參數（記錄用）：net.keepalive 預設 on，與 forwarder 每請求新開連線不同
