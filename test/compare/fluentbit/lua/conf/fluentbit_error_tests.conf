# Fluent Bit v5 — Lua error-injection test harness
#
# Usage (from lua/ directory):
#   ./script/run_crash.sh loop|io|cpu|mem|parse
#
# run_crash.sh 會自動更新 `call` 與 `protected_mode`，不需手動修改此檔案。

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /fluent-bit/test-logs.log
    Tag               test.lua
    Read_from_Head    true
    Refresh_Interval  1

[FILTER]
    Name           lua
    Match          test.lua
    Script         /fluent-bit/test_errors.lua
    protected_mode true
    call   test_cpu_exhaustion

[OUTPUT]
    Name   stdout
    Match  test.lua
