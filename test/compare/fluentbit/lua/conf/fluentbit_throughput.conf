# Fluent Bit v5 — Lua error-injection test harness
#
# Usage (from lua/ directory):
#   ./script/run_test.sh loop|io|cpu|mem|parse

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              ../test-logs.log
    Tag               test.lua
    Read_from_Head    true
    Refresh_Interval  1

[FILTER]
    Name           lua
    Match          test.lua
    Script         ../test_errors.lua
    protected_mode false

    # ── 取消注解其中一行以開啟對應測試（run_test.sh 自動切換）──
    # call   test_infinite_loop
    # call   test_io_blocking
    # call   test_cpu_exhaustion
    # call   test_memory_exhaustion
    # call   test_parse_error
    call   test_memory_exhaustion
    # ──────────────────────────────────────────────────────────

[OUTPUT]
    Name   stdout
    Match  test.lua
