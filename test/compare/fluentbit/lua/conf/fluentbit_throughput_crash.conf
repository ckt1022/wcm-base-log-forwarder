# Fluent Bit v5 — 流量中斷測試（loop / io）
#
# 測試流程:
#   1. loggen 持續輸入 → OUTPUT http 轉發到 sink_server
#   2. 注入 trigger record → Lua 進入無限迴圈或 blocking
#   3. sink_server 記錄流量歸零的時間點
#
# run_crash.sh 會自動更新 `call`，不需手動修改此檔案。

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /fluent-bit/test-logs.log
    Tag               test.lua
    Read_from_Head    true
    Refresh_Interval  1

[FILTER]
    Name           lua
    Match          test.lua
    Script         /fluent-bit/test_errors.lua
    protected_mode false
    call   test_memory_exhaustion

[OUTPUT]
    Name    http
    Match   test.lua
    Host    127.0.0.1
    Port    8080
    URI     /ingest
    Format  json_lines
