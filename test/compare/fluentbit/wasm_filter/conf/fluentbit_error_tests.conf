# Fluent Bit v5 — WASM filter error / trap test (stdout mode)
#
# Used by: run_crash.sh  parse
#
# run_crash.sh patches `wasm_path` before each run.

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /fluent-bit/test-logs.log
    Tag               test.wasm
    Read_from_Head    true
    Refresh_Interval  1

[FILTER]
    Name              wasm
    Match             test.wasm
    wasm_path         /fluent-bit/wasm/crash_loop.wasm
    function_name     filter_func
    wasm_heap_size    1073741824
    wasm_stack_size   8388608
    accessible_paths  /fluent-bit

[OUTPUT]
    Name   stdout
    Match  test.wasm
