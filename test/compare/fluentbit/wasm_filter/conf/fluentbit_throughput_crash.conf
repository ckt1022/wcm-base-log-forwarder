# Fluent Bit v5 — WASM filter crash / throughput test
#
# Used by: run_crash.sh  loop | io | cpu | mem
#
# run_crash.sh patches `wasm_path` (and `wasm_heap_size` for mem) automatically.
#
# wasm_heap_size    67108864
#   no Docker memory limit; mmap is lazy so no physical memory is consumed at
#   startup. For mem, run_crash.sh reduces it to 64 MB so the container can
#   start within Docker's --memory=512m ceiling, while Rust's Vec allocations
#   (which use WASM memory.grow, separate from the WAMR heap) still grow until
#   Docker's OOM killer fires.

[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off

[INPUT]
    Name              tail
    Path              /fluent-bit/test-logs.log
    Tag               test.wasm
    Read_from_Head    true
    Refresh_Interval  1

[FILTER]
    Name              wasm
    Match             test.wasm
    wasm_path         /fluent-bit/wasm/crash_mem.wasm
    function_name     filter_func
    wasm_heap_size    67108864
    wasm_stack_size   8388608
    accessible_paths  /fluent-bit

[OUTPUT]
    Name    http
    Match   test.wasm
    Host    127.0.0.1
    Port    8080
    URI     /ingest
    Format  json_lines
