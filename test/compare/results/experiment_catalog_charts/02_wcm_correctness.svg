<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:"Noto Sans CJK TC","Noto Sans",Arial,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#526174}.axis{font-size:14px}.label{font-size:15px;font-weight:600}.note{font-size:13px;fill:#526174}.grid{stroke:#dfe5ec;stroke-width:1}.axisline{stroke:#526174;stroke-width:1.5}</style>
<text x="70" y="44" class="title">WCM correctness results</text>
<text x="70" y="70" class="subtitle">Three repetitions per scenario; exact expected/received counts and validation verdicts</text>
