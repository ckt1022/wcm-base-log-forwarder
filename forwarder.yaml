# WCM Log Forwarder Configuration
# All plugin paths are relative to this file's directory (or absolute).

# 使用哪些階段，若有階段未啟用，預設使用RUST原生處理
# 
# (以下尚未實作)
# Parse:Default為解析json，只做最簡單的時間戳、日誌內容、日誌層級解析，預設endpoint標籤為A
# Filter:Default為不開啟就不做任何事情
# Format:Default為組合成json。
# Transport:Default傳遞


plugins:
  # C# Parser
  #parse: "test-plugins/csharp-plugin/parse/parser_csharp.wasm"
  parse: "test-plugins/csharp-plugin/parse_loop/parser_csharp_loop.wasm"
  # C  Parser
  #parse: "test-plugins/c-plugin/parse/parser_c_json.wasm"
  #parse: "test-plugins/c-plugin/parse_access/parser_c_access.wasm"
  #parse: "test-plugins/c-plugin/parse_bad/parser_c_bad.wasm"
  # GO Parser
  #parse: "test-plugins/go-plugin/parse/parser_json.wasm"
  #parse: "test-plugins/go-plugin/parse/parser_sys.wasm"
  #parse: "test-plugins/go-plugin/parse/parser_fmt.wasm"
  parse_noop: ~

  filter: "test-plugins/csharp-plugin/filter/filter_csharp.wasm"

  format: "test-plugins/c-plugin/format/format_json-flat.wasm"

  transport: "test-plugins/rust-plugin/transport/target/wasm32-unknown-unknown/release/transport_component.wasm"

# Which pipeline stages to enable
stages:
  filter: false
  format: false
  transport: false

# Input source — choose one mode
input:
  mode: tail       # "tcp" | "tail"
  tcp:
    host: "0.0.0.0"
    port: 5140
  tail:
    path: "/tmp/test-logs.log"

# Batch processing parameters (hot-reloadable at runtime)
batch:
  mem_limit_mb: 256
  safe_data_ratio: 0.5
  max_wait_ms: 1000
  max_batch_lines: 10000
  channel_capacity: 150000
  max_format_chunk: 50000
  transport_endpoint: "http://127.0.0.1:8080/ingest"
  max_transport_bytes: 131072
  transport_workers: 5
  # parse→filter / filter→format / format→transport 三條 pipeline channel 容量
  pipeline_channel_capacity: 20000
  # 每個階段 WASM 呼叫超時上限（ms）；超過後重試最多 2 次，均失敗寫入 error.txt
  stage_timeout_ms: 5000

# 後端transport的標籤，可以有多個，以字母方式排序。
endpoint:
  A: "http://127.0.0.1:8080/ingest"
  B: "http://127.0.0.1:8000/ingest"
  C: "http://127.0.0.1:5000/ingest"

# How often (seconds) to re-read this file and apply changes
config_reload_secs: 10
